[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-mask-auditor-demo"
version = "0.1.0"
description = "A small SCL safety-mask analysis and correction demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
scl-mask-demo = "scl_mask_demo:main"

[tool.setuptools]
py-modules = ["scl_mask_demo"]
